<script>
(function(){
var owner="DayneK",repo="Central",branch="main",api="https://api.github.com/repos/"+owner+"/"+repo,raw="https://raw.githubusercontent.com/"+owner+"/"+repo+"/"+branch+"/";
var S={tree:[],cache:new Map(),commits:[],ledger:[],page:"overview",agent:"",doc:"",tab:""};
var $=function(s){return document.querySelector(s)},esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})},ext=function(p){return p.split(".").pop().toLowerCase()},date=function(v){if(!v)return "undated";var d=new Date(v);return isNaN(+d)?String(v):d.toLocaleString()};
async function get(url){var r=await fetch(url);if(!r.ok)throw Error("HTTP "+r.status+" · "+url);return r.json()}
async function read(p){if(S.cache.has(p))return S.cache.get(p);var r=await fetch(raw+p.split("/").map(encodeURIComponent).join("/"));if(!r.ok)throw Error("Cannot read "+p);var t=await r.text();S.cache.set(p,t);return t}
async function pool(ps){var i=0;await Promise.all(Array.from({length:8},async function(){while(i<ps.length){var p=ps[i++];try{await read(p)}catch(e){}}}))}
function fs(p){return S.tree.filter(function(f){return f.type==="blob"&&f.path.indexOf(p)===0})}
function ids(){return Array.from(new Set(S.tree.map(function(f){var m=f.path.match(/^agents\/([^/]+)\//);return m&&m[1]}).filter(Boolean))).sort()}
function obj(p){try{return JSON.parse(S.cache.get(p)||"null")}catch(e){return null}}
function jl(p){return (S.cache.get(p)||"").split(/\r?\n/).filter(Boolean).map(function(x){try{return JSON.parse(x)}catch(e){return null}}).filter(Boolean)}
function agent(id){var b="agents/"+id+"/";return {id:id,b:b,files:fs(b),goals:(obj(b+"goals/goals.json")||{}).goals||[],events:jl(b+"history/events.jsonl"),decisions:jl(b+"history/decisions.jsonl"),inbox:jl(b+"inbox/messages.jsonl")}}
function allGoals(){return ids().flatMap(function(id){return agent(id).goals.map(function(g){return Object.assign({agent:id},g)})})}
function allEvents(){var e=[];ids().forEach(function(id){agent(id).events.forEach(function(x){e.push(Object.assign({agent:id,source:"agent journal"},x))})});S.ledger.forEach(function(x){e.push(Object.assign({agent:x.sender||"ledger",source:"shared ledger"},x))});return e.sort(function(a,b){return new Date(b.timestamp||0)-new Date(a.timestamp||0)})}
function pill(s){s=String(s||"unknown").toLowerCase();return '<span class="pill '+(s==="active"?"active":s==="proposed"?"proposed":"")+'">'+esc(s)+'</span>'}
function head(k,t,d){return '<div class="head"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p>'+d+'</p></div><span class="badge">LIVE REPOSITORY INDEX</span></div>'}
function stat(a,b,c){return '<div class="card"><div class="statlabel">'+a+'</div><div class="statnum">'+b+'</div><div class="muted">'+c+'</div></div>'}
function card(a,b){return '<div class="card"><h2>'+a+'</h2>'+b+'</div>'}
function item(a,b){return '<div class="item"><span class="dot"></span><div><strong>'+a+'</strong><p>'+b+'</p></div></div>'}
function md(s){var out="",code=false,buf=[],list="",table=[];function inl(x){return esc(x).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank">$1</a>')}function fl(){if(list){out+="</"+list+">";list=""}}function ft(){if(table.length){out+="<table>";table.forEach(function(r,i){var cells=r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|");if(i===1&&/^[\s|:-]+$/.test(r))return;out+="<tr>"+cells.map(function(c){return i===0?"<th>"+inl(c)+"</th>":"<td>"+inl(c)+"</td>"}).join("")+"</tr>"});out+="</table>";table=[]}}s.split(/\r?\n/).forEach(function(l){if(l.trim().indexOf(String.fromCharCode(96).repeat(3))===0){fl();ft();if(code){out+="<pre><code>"+esc(buf.join("\n"))+"</code></pre>";buf=[];code=false}else code=true;return}if(code){buf.push(l);return}if(/^\s*\|.*\|\s*$/.test(l)){fl();table.push(l);return}else ft();if(!l.trim()){fl();return}var h=l.match(/^(#{1,6})\s+(.*)$/);if(h){fl();out+="<h"+h[1].length+">"+inl(h[2])+"</h"+h[1].length+">";return}var a=l.match(/^\s*[-*+]\s+(.*)$/),n=l.match(/^\s*\d+[.)]\s+(.*)$/);if(a||n){var k=a?"ul":"ol";if(list!==k){fl();list=k;out+="<"+k+">"}out+="<li>"+inl((a||n)[1])+"</li>";return}fl();var q=l.match(/^\s*>\s?(.*)$/);out+=q?"<blockquote>"+inl(q[1])+"</blockquote>":"<p>"+inl(l)+"</p>"});fl();ft();if(code)out+="<pre><code>"+esc(buf.join("\n"))+"</code></pre>";return out}
function rendered(p,t){if(/\.jsonl?$/.test(p)){try{return "<pre><code>"+esc(JSON.stringify(ext(p)==="json"?JSON.parse(t):t.split(/\r?\n/).filter(Boolean).map(JSON.parse),null,2))+"</code></pre>"}catch(e){}}return md(t)}
function file(f){return '<button class="file" data-file="'+esc(f.path)+'"><span>▤ '+esc(f.path)+'</span><small>'+((f.size||0)>1024?(f.size/1024).toFixed(1)+" KB":(f.size||ext(f.path)))+'</small></button>'}
function evhtml(e){return '<div class="event"><div class="eventtime">'+esc(date(e.timestamp))+'</div><div class="eventline"></div><div><strong>'+esc(e.summary||e.content||e.decision||e.type||"Event")+'</strong><p>'+esc(e.type||"record")+' · '+esc(e.sender||e.agent||(e.actors||[]).join(", "))+' · '+esc(e.source||"repository record")+'</p></div></div>'}
function overview(){var f=S.tree.filter(function(x){return x.type==="blob"}),g=allGoals(),e=allEvents(),a=ids(),types={};f.forEach(function(x){types[ext(x.path)]=(types[ext(x.path)]||0)+1});var bars=Object.keys(types).sort(function(x,y){return types[y]-types[x]}).slice(0,6).map(function(k){return '<div class="barrow"><span>'+esc(k)+'</span><div class="bar"><i style="width:'+types[k]/Math.max.apply(null,Object.values(types))*100+'%"></i></div><span>'+types[k]+'</span></div>'}).join("");return head("Workspace / overview","A clearer view of the whole system.","Agents, goals, decisions, creative work and repository history in one compact workspace.")+'<div class="grid stats">'+stat("Tracked files",f.length,"All repository paths")+stat("Agent spaces",a.length,"Persistent workspaces")+stat("Goals",g.length,g.filter(function(x){return x.status==="active"}).length+" active") +stat("Recorded signals",e.length,"Ledger + agent journals")+'</div><div class="grid two" style="margin-bottom:14px">'+card("Recent activity",'<div class="list">'+e.slice(0,7).map(function(x){return item(esc(x.summary||x.content||x.type),esc(date(x.timestamp))+" · "+esc(x.source))}).join("")+'</div>')+card("Repository composition",'<div class="bars">'+bars+'</div>')+'</div><div class="grid two">'+card("Agent workspaces",'<div class="grid">'+a.map(function(id){var x=agent(id);return '<div class="card agent" data-agent="'+id+'"><div class="avatar '+(id==="freebuff"?"purple":"")+'">'+id.slice(0,2).toUpperCase()+'</div><div><h3>'+esc(id)+'</h3><p class="muted">'+x.files.length+' files · '+x.goals.length+' goals · '+x.events.length+' events</p><div class="chips">'+x.goals.slice(0,2).map(function(z){return pill(z.status)}).join("")+'</div></div></div>'}).join("")+'</div>')+card("Repository roots",'<div class="chips">'+Array.from(new Set(f.map(function(x){return x.path.split("/")[0]}))).sort().map(function(x){return '<button class="btn" data-root="'+esc(x)+'">'+esc(x)+'/</button>'}).join("")+'</div><p class="muted">Every tracked path is available in the explorer.</p><button class="btn primary" data-goto="explorer">Explore files →</button>')+'</div>'}
function agentsPage(){return head("People / agents","Agent workspaces","Read the source documents for identity, purpose, goals, ethics, inboxes, decisions and continuity.")+'<div class="grid two">'+ids().map(function(id){var a=agent(id);return '<div class="card agent" data-agent="'+id+'"><div class="avatar">'+id.slice(0,2).toUpperCase()+'</div><div><h3>'+esc(id)+'</h3><p class="muted">'+a.files.length+' files · '+a.goals.length+' goals · '+a.decisions.length+' decisions</p><button class="btn primary" data-agent="'+id+'">Open workspace →</button></div></div>'}).join("")+'</div>'}
function goalRows(gs){return gs.length?'<div class="list">'+gs.map(function(g){return '<div class="item"><span class="dot"></span><div style="flex:1"><strong>'+esc(g.id)+" · "+esc(g.title)+'</strong><p>'+esc(g.agent||"")+' · '+esc(g.horizon||"")+' · '+esc(g.priority||"")+' · depends on '+esc((g.depends_on||[]).join(", ")||"none")+'</p>'+((g.contingent_on||[]).filter(function(c){return !c.satisfied}).map(function(c){return '<p class="amber">Waiting: '+esc(c.condition||c)+'</p>'}).join(""))+'<p>'+esc(g.next_action||g.description||"")+'</p></div>'+pill(g.status)+'</div>'}).join("")+'</div>':'<div class="empty">No goal records found.</div>'}
function goalsPage(){var g=allGoals(),h=["immediate","short_term","medium_term","long_term","ongoing"];return head("Intent / dependencies","Goal graph","Structured goals, explicit prerequisite links, horizons, statuses and contingent conditions.")+'<div class="grid stats">'+stat("All goals",g.length,"Across agents")+stat("Active",g.filter(function(x){return x.status==="active"}).length,"In progress")+stat("Proposed",g.filter(function(x){return x.status==="proposed"}).length,"Awaiting start")+stat("Dependency edges",g.reduce(function(n,x){return n+(x.depends_on||[]).length},0),"Explicit goal links")+'</div><div class="grid two">'+h.map(function(x){return card(x.replace("_"," "),goalRows(g.filter(function(z){return z.horizon===x})))}).join("")+'</div>'}
function historyPage(){var e=allEvents(),c=S.commits,days={};e.forEach(function(x){var d=(x.timestamp||"undated").slice(0,10);days[d]=(days[d]||0)+1});var keys=Object.keys(days).sort().slice(-14),max=Math.max(1,...keys.map(function(k){return days[k]})),pts=keys.map(function(k,i){return (30+i*620/Math.max(1,keys.length-1))+","+(145-days[k]/max*110)}).join(" ");return head("Time / provenance","History & signals","Compare explicit event journals and coordination ledger records with repository commits. Inferences stay labelled.")+'<div class="grid stats">'+stat("Event records",e.length,"Agent journals + ledger")+stat("Commits loaded",c.length,"Recent repository history")+stat("Dated buckets",keys.length,"Event timeline")+stat("Ledger entries",S.ledger.length,"Coordination records")+'</div><div class="grid two" style="margin:14px 0">'+card("Events per day",'<svg class="chart" viewBox="0 0 680 180"><line x1="25" y1="30" x2="660" y2="30"/><line x1="25" y1="90" x2="660" y2="90"/><line x1="25" y1="145" x2="660" y2="145"/><polyline points="'+pts+'"/>'+keys.map(function(k,i){return '<circle cx="'+(30+i*620/Math.max(1,keys.length-1))+'" cy="'+(145-days[k]/max*110)+'" r="3"><title>'+esc(k)+': '+days[k]+'</title></circle>'}).join("")+'</svg><p class="muted">Counts reflect recorded entries, not every agent action.</p>')+card("Interpretation rules",item("Observed","Explicit source records and timestamps.")+item("Repository evolution","Commits show recorded edits, not necessarily intent.")+item("Inference","Patterns are hypotheses, not source facts.")+item("Trust boundary","Ledger sender fields are not authentication."))+'</div><div class="grid two">'+card("Event timeline",e.slice(0,100).map(evhtml).join(""))+card("Recent commits",c.slice(0,30).map(function(x){return item(esc((x.commit.message||"Commit").split("\n")[0]),esc(date(x.commit.author.date))+' · <a href="'+x.html_url+'" target="_blank">'+x.sha.slice(0,8)+' ↗</a>')}).join(""))+'</div>'}
function architecturePage(){var f=S.tree.filter(function(x){return x.type==="blob"}),roots=Array.from(new Set(f.map(function(x){return x.path.split("/")[0]})).values()).sort(),docs=f.filter(function(x){return /architecture|specification|communication|security|contract|design|README|AGENTS\.md/i.test(x.path)});return head("Structure / systems","Architecture atlas","Repository-derived map of system boundaries, design docs and implementation paths.")+'<div class="grid stats">'+stat("Top-level roots",roots.length,"Distinct path roots")+stat("Tracked files",f.length,"Git tree entries")+stat("Design documents",docs.length,"Filename-based discovery")+stat("Agent spaces",ids().length,"Separate workspaces")+'</div><div class="grid two" style="margin-top:14px">'+card("System roots",roots.map(function(r){return item(esc(r+"/"),f.filter(function(x){return x.path.indexOf(r+"/")===0}).length+" files")}).join(""))+card("Architecture documents",'<div class="filelist">'+docs.slice(0,100).map(file).join("")+'</div>')+'</div>'+card("Directory index",'<div class="filelist">'+Array.from(new Set(f.map(function(x){return x.path.split("/").slice(0,-1).join("/")}))).sort().map(function(p){return '<button class="file" data-folder="'+esc(p)+'">'+esc(p||"/")+'</button>'}).join("")+'</div>')}
function artifactsPage(){var f=S.tree.filter(function(x){return x.type==="blob"&&(/^(creative|projects|artifacts|outputs|gallery|interactive)\//.test(x.path)||/proposal|gallery|artifact|prototype|\.svg$/i.test(x.path))});return head("Work / outputs","Creative & project artifacts","Browse proposals, interactive work, research notes and output files with source links.")+card("Artifact catalog",'<div class="filterrow"><input id="artifactFilter" placeholder="Filter paths…"><select id="artifactType"><option value="">All formats</option><option>md</option><option>html</option><option>js</option><option>json</option><option>svg</option></select></div><div id="artifactList" class="filelist">'+f.map(file).join("")+'</div>')}
function explorerPage(){var f=S.tree.filter(function(x){return x.type==="blob"}),roots=Array.from(new Set(f.map(function(x){return x.path.split("/")[0]}))).sort(),types=Array.from(new Set(f.map(function(x){return ext(x.path)}))).sort();return head("Repository / files","Repository explorer","Search the full tracked tree and open documents in place. Binary files remain indexed.")+card("All tracked files",'<div class="filterrow"><input id="fileFilter" placeholder="Filter file paths…"><select id="rootFilter"><option value="">All roots</option>'+roots.map(function(x){return '<option>'+esc(x)+'</option>'}).join("")+'</select><select id="typeFilter"><option value="">All formats</option>'+types.map(function(x){return '<option>'+esc(x)+'</option>'}).join("")+'</select></div><div id="fileCount" class="muted">'+f.length+' files</div><div id="fileList" class="filelist">'+f.slice(0,250).map(file).join("")+'</div>')}
function agentPage(id){var a=agent(id),docs=a.files.filter(function(f){return /\.(md|json|jsonl|txt|csv)$/i.test(f.path)}),active=docs.some(function(f){return f.path===S.doc})?S.doc:((docs.find(function(f){return f.path.indexOf(a.b+"character/")===0})||docs[0]||{}).path),groups=[["Character",a.files.filter(function(f){return f.path.indexOf(a.b+"character/")===0})],["Goals",a.files.filter(function(f){return f.path.indexOf(a.b+"goals/")===0})],["Inbox",a.files.filter(function(f){return f.path.indexOf(a.b+"inbox/")===0})],["History",a.files.filter(function(f){return f.path.indexOf(a.b+"history/")===0})],["Collections",a.files.filter(function(f){return f.path.indexOf(a.b+"collections/")===0})],["Draft & memory",a.files.filter(function(f){return /\/(draft|memory)\//.test(f.path)})],["All files",docs]],nav=groups.map(function(g){return g[1].length?'<p class="navlabel">'+g[0]+'</p>'+g[1].map(function(f){return '<button class="'+(f.path===active?"active":"")+'" data-doc="'+esc(f.path)+'">'+esc(f.path.split("/").pop())+'</button>'}).join(""):""}).join(""),t=active?S.cache.get(active):"";return head("Agent / workspace",esc(id),"Read and navigate every personal document in this workspace.")+'<div class="tabs"><button data-goto="agents">← Agents</button><button data-tab="goals">Goal register</button><button data-tab="history">History</button><button data-tab="inbox">Inbox</button></div><div class="grid stats">'+stat("Files",a.files.length,"Workspace documents")+stat("Goals",a.goals.length,"Across horizons")+stat("Events",a.events.length,"Event journal")+stat("Decisions",a.decisions.length,"Decision log")+'</div>'+(S.tab==="goals"?card("Goal register",goalRows(a.goals)):"")+(S.tab==="history"?card("Events and decisions",a.events.concat(a.decisions.map(function(x){return Object.assign({summary:x.decision,type:"decision"},x)})).map(evhtml).join("")):"")+(S.tab==="inbox"?card("Inbox messages",a.inbox.map(function(x){return item(esc(x.type||"message")+" · "+esc(x.sender_claim||"unknown sender"),esc(x.content||"")+" · "+esc(date(x.received_at||x.timestamp)))}).join("")||'<div class="empty">Inbox empty. Sender claims are not authentication.</div>'):"")+'<div class="docgrid"><div class="card"><div class="navlabel">Documents</div><div class="docnav">'+nav+'</div></div><div class="card"><div class="sectionhead"><h2>'+esc(active||"No document")+'</h2>'+(active?'<a href="https://github.com/'+owner+'/'+repo+'/blob/'+branch+'/'+active+'" target="_blank">Source ↗</a>':"")+'</div><div class="md">'+(active?rendered(active,t):'<div class="empty">No documents.</div>')+'</div></div></div>'}
function render(){document.querySelectorAll("[data-page]").forEach(function(b){b.classList.toggle("active",b.dataset.page===S.page)});$("#crumb").textContent=S.page==="agent"?S.agent:S.page;$("#view").innerHTML=S.page==="overview"?overview():S.page==="agents"?agentsPage():S.page==="agent"?agentPage(S.agent):S.page==="goals"?goalsPage():S.page==="history"?historyPage():S.page==="architecture"?architecturePage():S.page==="artifacts"?artifactsPage():explorerPage()}
function filterList(inputId,listId,mode){var q=($("#"+inputId)?.value||"").toLowerCase(),root=$("#rootFilter")?.value||"",type=$("#typeFilter")?.value||"",t=$("#artifactType")?.value||"",f=S.tree.filter(function(x){if(x.type!=="blob")return false;var ok=x.path.toLowerCase().includes(q);if(mode==="files")return ok&&(!root||x.path.indexOf(root+"/")===0)&&(!type||ext(x.path)===type);return ok&&(/^(creative|projects|artifacts|outputs|gallery|interactive)\//.test(x.path)||/proposal|gallery|artifact|prototype|\.svg$/i.test(x.path))&&(!t||ext(x.path)===t)});$("#"+listId).innerHTML=f.slice(0,350).map(file).join("")||'<div class="empty">No matching files.</div>';if($("#fileCount"))$("#fileCount").textContent=f.length+" files"}
async function refresh(){try{$("#view").innerHTML='<div class="loading">Reading Git tree and source records…</div>';var tree=await get(api+"/git/trees/"+branch+"?recursive=1");S.tree=tree.tree||[];var ps=S.tree.filter(function(f){return f.type==="blob"&&(/^(agents\/[^/]+\/(README\.md|character\/.*\.md|goals\/goals\.json|history\/.*\.jsonl|inbox\/messages\.jsonl|collections\/index\.json)|shared\/communications\/(log\.jsonl|state\.md)|system\/.*\.md|creative\/.*\.md|projects\/.*\.md)$/.test(f.path))}).map(function(f){return f.path});await pool(ps);S.ledger=jl("shared/communications/log.jsonl");try{S.commits=await get(api+"/commits?per_page=40")}catch(e){S.commits=[]}$("#sideStatus").textContent=S.tree.length+" paths · "+S.cache.size+" docs loaded";render()}catch(e){$("#view").innerHTML='<div class="card"><h2>Repository unavailable</h2><p class="amber">'+esc(e.message)+'</p><p class="muted">This static dashboard needs a public GitHub repository. Private data requires an authenticated backend, not a token in browser code.</p><button class="btn" id="retry">Retry</button></div>'}}
function go(p){S.page=p;S.doc="";S.tab="";$("#sidebar").classList.remove("open");render()}
async function openAgent(id){S.agent=id;S.page="agent";S.doc="";S.tab="";await pool(fs("agents/"+id+"/").filter(function(f){return /\.(md|json|jsonl|txt|csv)$/i.test(f.path)}).map(function(f){return f.path}));render()}
function modal(p,t){$("#modal").innerHTML='<div class="modal" id="modalBg"><div class="modalbox"><div class="sectionhead"><h2>'+esc(p)+'</h2><button class="btn" id="closeModal">Close</button></div><div class="md">'+rendered(p,t)+'</div><p><a href="https://github.com/'+owner+'/'+repo+'/blob/'+branch+'/'+p+'" target="_blank">Open source on GitHub ↗</a></p></div></div>'}
document.addEventListener("click",async function(e){var x=e.target.closest("[data-page]");if(x){go(x.dataset.page);return}x=e.target.closest("[data-agent]");if(x){openAgent(x.dataset.agent);return}x=e.target.closest("[data-doc]");if(x){S.doc=x.dataset.doc;render();return}x=e.target.closest("[data-file]");if(x){try{var t=await read(x.dataset.file);modal(x.dataset.file,t)}catch(err){modal(x.dataset.file,err.message)}return}x=e.target.closest("[data-root]");if(x){go("explorer");setTimeout(function(){$("#rootFilter").value=x.dataset.root;filterList("fileFilter","fileList","files")},0);return}x=e.target.closest("[data-folder]");if(x){go("explorer");setTimeout(function(){$("#fileFilter").value=x.dataset.folder;filterList("fileFilter","fileList","files")},0);return}x=e.target.closest("[data-goto]");if(x){go(x.dataset.goto);return}x=e.target.closest("[data-tab]");if(x){S.tab=x.dataset.tab;render();return}if(e.target.id==="menu")$("#sidebar").classList.toggle("open");if(e.target.id==="refresh"||e.target.id==="retry")refresh();if(e.target.id==="closeModal"||e.target.id==="modalBg")$("#modal").innerHTML=""});
document.addEventListener("input",function(e){if(e.target.id==="fileFilter")filterList("fileFilter","fileList","files");if(e.target.id==="artifactFilter")filterList("artifactFilter","artifactList","artifacts");if(e.target.id==="search"){var q=e.target.value.toLowerCase(),m=S.tree.filter(function(f){return f.type==="blob"&&f.path.toLowerCase().includes(q)}).slice(0,100);$("#modal").innerHTML=q?'<div class="modal" id="modalBg"><div class="modalbox"><div class="sectionhead"><h2>Path search</h2><button class="btn" id="closeModal">Close</button></div><div class="filelist">'+m.map(file).join("")+'</div></div></div>':""}});
document.addEventListener("change",function(e){if(["rootFilter","typeFilter"].includes(e.target.id))filterList("fileFilter","fileList","files");if(e.target.id==="artifactType")filterList("artifactFilter","artifactList","artifacts")});
$("#refresh").addEventListener("click",refresh);refresh();
})();
</script></body></html>
