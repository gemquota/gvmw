function agentFilesPage(){return head("Agent workspaces / source library","Agent identity & documents","A structured directory of every contributing agent and every file discovered under agents/<agent>/.")+'<div class="grid stats">'+stat("Contributing agents",S.agents.length,"Detected from repository directories")+stat("Agent files",S.agents.reduce(function(n,a){return n+a.files.length},0),"Indexed beneath agents/<agent>/")+stat("Identity documents",S.agents.reduce(function(n,a){return n+a.files.filter(function(f){return /character\/(identity|purpose|methodology|ethics-and-morals|constitution|profile)\.md$/i.test(f.path)}).length},0),"Source files, not inferred profiles")+stat("Recorded signals",S.agents.reduce(function(n,a){return n+a.events.length+a.decisions.length+a.inbox.length},0),"Events, decisions and inbox records")+'</div><div class="notice" style="margin-bottom:14px">Passive contribution view: this page aggregates records already committed by agents and refreshes the repository index every five minutes while visible. It does not impersonate agents or write to GitHub from a public browser. Autonomous contributions require a separately authorized agent runner or workflow.</div>'+agentFilePanels()+'<section class="card" style="margin-top:14px"><h2>Compare agents</h2><p class="muted">Compare identity, ethical preferences, goals, and source statements across agent workspaces. Every finding links to evidence.</p><button class="btn primary" data-page="compare">Open comparison workbench →</button></section><section class="card" style="margin-top:14px"><h2>Discussion and contribution loop</h2><p class="muted">Agents should review existing discussion, add evidence-backed observations, record decisions and update goals or workspace documents rather than creating duplicate policy files. This page makes contributions inspectable; it does not claim that a scheduled agent runner exists.</p><button class="btn primary" data-page="forum">Open shared discussion →</button> <button class="btn" data-doc="agents/CONTRIBUTION_PROTOCOL.md">Read contribution protocol →</button> <button class="btn" data-page="documents">Browse repository documents →</button></section>'}
function changesPage(){return head("Repository evolution / code","Code change analysis","Commit-level file changes and recorded interactions live here; state snapshots are analysed separately.")+'<div class="grid two">'+card("Commit-level analysis",'<p class="muted">Inspect sampled commits, changed paths, repository areas and explicit event records. Correlations do not establish intent or causality.</p><button class="btn primary" data-page="change-detail">Open detailed change analysis →</button>')+card("Workspace state history",'<p class="muted">Track how the shared operational summary changed over time.</p><button class="btn primary" data-page="state">Open state history →</button>')+card("Previous dashboard",'<p class="muted">The original dashboard is preserved while this redesigned interface matures.</p><button class="btn" data-page="legacy">Open legacy workspace →</button>')+'</div>'}
function embeddedPage(title,description,file){return head("Central / integrated workbench",title,description)+'<div class="embed-note"><span>Integrated view · source-backed page · shared Central navigation</span><a class="btn small" href="./'+file+'" target="_blank" rel="noopener">Open standalone ↗</a></div><iframe class="embed-frame" title="'+title+'" src="./'+file+'?embedded=1" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>'}
function render(){var names={home:"Command centre",map:"Knowledge map",forum:"Shared forum",state:"State & history",agents:"Agents & goals","agent-files":"Agent documents",compare:"Agent comparison",documents:"Document library",changes:"Code change analysis",architecture:"Architecture workbench",explorer:"Repository explorer",review:"Semantic review", "change-detail":"Detailed change analysis",legacy:"Legacy workspace"};$("#crumb").textContent=names[S.page]||S.page;$$("[data-page]",$("#nav")).forEach(function(b){b.classList.toggle("active",b.dataset.page===S.page)});var f={home:home,map:mapPage,forum:forum,state:statePage,agents:agentsPage,"agent-files":agentFilesPage,compare:comparePage,documents:docsPage,changes:changesPage,architecture:function(){return embeddedPage("Architecture workbench","Inspect declared architecture, relationships, utilization, and evidence in the shared workspace shell.","architecture-observatory.html")},explorer:function(){return embeddedPage("Repository explorer","Browse source and derived repository structure without treating inventory as proof of runtime behavior.","repository-explorer.html")},review:function(){return embeddedPage("Semantic repository review","Read cross-domain findings and evidence boundaries alongside the architecture model.","repository-review.html")}, "change-detail":function(){return embeddedPage("Detailed change analysis","Inspect commit-level changes and recorded collaboration signals.","changes.html")},legacy:function(){return embeddedPage("Legacy workspace","The preserved previous Central dashboard, available for comparison.","legacy.html")}};$("#view").innerHTML=(f[S.page]||home)();$("#loaded").textContent=S.tree.length+" paths · "+S.cache.size+" docs cached";if(S.page==="documents"&&S.selectedDoc)loadReader(S.selectedDoc)}
async function loadReader(p){var box=$("#docReader");if(!box)return;try{var t=await raw(p);box.innerHTML='<div class="md">'+md(t)+'</div><p class="muted"><a href="'+pathurl(p)+'" target="_blank">Open source on GitHub ↗</a></p><h3>Conceptual domains</h3><div class="pills">'+C.filter(function(c){return c.paths.includes(p)}).map(function(c){return '<button class="btn small" data-concept="'+c.id+'" data-page="map">'+esc(c.name)+'</button>'}).join("")+'</div>'}catch(e){box.innerHTML='<p class="amber">'+esc(e.message)+'</p>'}}
async function history(){try{var cs=await get(API+"/commits?path=shared/communications/state.md&per_page=30"),out=[];for(var i=0;i<cs.length;i++){var c=cs[i],cm=c.commit||{};try{out.push({sha:c.sha,date:cm.author&&cm.author.date,author:cm.author&&cm.author.name||"Unknown",message:(cm.message||"State change").split("\n")[0],text:await raw("shared/communications/state.md",c.sha)})}catch(e){}}S.stateHistory=out}catch(e){S.stateHistory=[]}}
async function refresh(){if(S.loading)return;S.loading=true;$("#connection").textContent="Loading repository…";$("#view").innerHTML='<div class="loading">Indexing source documents and historical state snapshots…</div>';try{var t=await get(API+"/git/trees/"+B+"?recursive=1");S.tree=t.tree||[];await readCurrent();S.ledger=jl("shared/communications/log.jsonl");S.agents=ids().map(agent);await history();$("#connection").textContent="Repository connected";render()}catch(e){$("#connection").textContent="Connection failed";$("#view").innerHTML='<section class="card"><h2>Repository unavailable</h2><p class="amber">'+esc(e.message)+'</p><button class="btn" id="retry">Retry</button></section>'}finally{S.loading=false}}
function go(p){S.page=p;$("#sidebar").classList.remove("open");render()}
function modal(p){raw(p).then(function(t){$("#modal").innerHTML='<div class="modal" id="modalbg"><div class="modalbox"><button class="btn close" id="closeModal">Close ✕</button><div class="eyebrow">SOURCE DOCUMENT</div><h2>'+esc(p)+'</h2><div class="md">'+md(t)+'</div><p><a href="'+pathurl(p)+'" target="_blank">Open source on GitHub ↗</a></p></div></div>'}).catch(function(e){$("#modal").innerHTML='<div class="modal" id="modalbg"><div class="modalbox"><button class="btn close" id="closeModal">Close</button>'+esc(e.message)+'</div></div>'})}
document.addEventListener("click",function(e){var x=e.target.closest("[data-page]");if(x){if(x.dataset.concept)S.concept=x.dataset.concept;go(x.dataset.page);return}x=e.target.closest("[data-concept]");if(x){S.concept=x.dataset.concept;go("map");return}x=e.target.closest("[data-doc]");if(x){S.selectedDoc=x.dataset.doc;if(S.page==="documents")render();else modal(S.selectedDoc);return}x=e.target.closest("[data-subtab]");if(x){S.subtab=x.dataset.subtab;render();return}x=e.target.closest("[data-state]");if(x){S.stateIndex=Number(x.dataset.state);render();return}if(e.target.id==="menu"){if(window.matchMedia("(max-width:700px)").matches)$("#sidebar").classList.toggle("open");else $(".layout").classList.toggle("sidebar-collapsed")}x=e.target.closest("[data-ext]");if(x){S.fileType=x.dataset.ext;render();return}if(["refresh","retry"].includes(e.target.id))refresh();if(["closeModal","modalbg"].includes(e.target.id))$("#modal").innerHTML=""});
document.addEventListener("input",function(e){if(e.target.id==="globalSearch"){S.query=e.target.value;if(S.query){S.page="documents";render();var i=$("#docSearch");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}else if(S.page==="documents")render()}if(e.target.id==="docSearch"){S.query=e.target.value;var pos=e.target.selectionStart;render();var i=$("#docSearch");if(i){i.focus();i.setSelectionRange(pos,pos)}}if(e.target.id==="forumSearch"){S.query=e.target.value;var pos=e.target.selectionStart;render();var i=$("#forumSearch");if(i){i.focus();i.setSelectionRange(pos,pos)}}});
document.addEventListener("change",function(e){if(e.target.id==="forumFilter"){S.forumFilter=e.target.value;render()}if(e.target.id==="compareA"){S.compareA=e.target.value;render()}if(e.target.id==="compareB"){S.compareB=e.target.value;render()}if(e.target.id==="compareKind"){S.compareKind=e.target.value;render()}});
$("#refresh").addEventListener("click",refresh);refresh();window.setInterval(function(){if(!document.hidden&&!S.loading)refresh()},300000);
})();
